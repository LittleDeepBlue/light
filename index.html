        <title>深藍教 光明燈</title>

        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@900&display=swap&text=%E5%85%89%E6%98%8E%E7%87%88%E8%AE%80%E5%8F%96%E4%B8%AD%E7%A5%9D%E6%82%A8%E9%97%94%E5%AE%B6%E5%B9%B3%E5%AE%89%E3%80%81%E8%90%AC%E4%BA%8B%E9%A0%86%E5%88%A90123456789%25" rel="stylesheet">
        <style type="text/css">
            body, html
            {
                margin: 0; padding: 0; height: 100%; overflow: hidden;
                background: #2b0000;
            }

            #content
            {
                position:absolute; left: 0; right: 0; bottom: 0; top: 0px; 
            }

            /* ===== 讀取中畫面 ===== */
            #loader{
                position: fixed;
                inset: 0;
                z-index: 10;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                padding: 24px;
                box-sizing: border-box;
                background: radial-gradient(ellipse 75% 60% at 50% 42%, #4d0b00 0%, #2b0000 72%);
                color: #e7c76a;
                text-align: center;
                transition: opacity .6s ease, visibility .6s ease;
            }
            #loader.hide{
                opacity: 0;
                visibility: hidden;
                pointer-events: none;
            }
            .ld-orb{
                width: 68px;
                height: 68px;
                border-radius: 50%;
                background: radial-gradient(circle at 40% 35%, #fff6c8 0 12%, #ffd36a 38%, #ff9a2e 70%, #b8480a 100%);
                box-shadow: 0 0 22px 8px rgba(255, 170, 50, .55), 0 0 60px 22px rgba(255, 120, 20, .28);
                animation: ldPulse 2.4s ease-in-out infinite;
            }
            .ld-title{
                margin: 30px 0 0;
                font-family: "Noto Serif TC", "Songti TC", "PMingLiU", "Microsoft JhengHei", serif;
                font-weight: 900;
                font-size: clamp(26px, 6vw, 40px);
                line-height: 1.2;
                letter-spacing: .25em;
                padding-left: .25em;
                color: #e8be3c;
                background: linear-gradient(180deg, #fff2ae 0%, #f0c94a 45%, #b5821a 100%);
                -webkit-background-clip: text;
                background-clip: text;
                -webkit-text-fill-color: transparent;
                filter: drop-shadow(0 2px 0 #5a2a00) drop-shadow(0 0 12px rgba(255, 190, 60, .3));
            }
            .ld-dots{ display: inline-block; margin-left: 2px; letter-spacing: .1em; }
            .ld-dots i{ font-style: normal; animation: ldDot 1.2s ease-in-out infinite; opacity: .2; }
            .ld-dots i:nth-child(2){ animation-delay: .2s; }
            .ld-dots i:nth-child(3){ animation-delay: .4s; }
            .ld-bar{
                width: min(280px, 72vw);
                height: 10px;
                margin-top: 28px;
                border: 1px solid #8a5d0e;
                border-radius: 6px;
                background: #140000;
                box-shadow: inset 0 0 6px #000, 0 0 10px rgba(255, 150, 40, .25);
                overflow: hidden;
            }
            .ld-fill{
                height: 100%;
                width: 0%;
                background:
                    repeating-linear-gradient(90deg, rgba(0, 0, 0, .35) 0 2px, transparent 2px 6px),
                    linear-gradient(180deg, #ffe38a, #e8a02a 60%, #b8660a);
                box-shadow: 0 0 8px rgba(255, 190, 60, .8);
            }
            .ld-pct{
                margin-top: 14px;
                min-width: 4ch;
                font-family: "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", sans-serif;
                font-weight: 700;
                font-size: 28px;
                line-height: 1;
                letter-spacing: .08em;
                font-variant-numeric: tabular-nums;
                color: #ff4a12;
                text-shadow: 0 0 6px rgba(255, 70, 0, .6);
            }
            .ld-sub{
                margin-top: 24px;
                font-family: "Noto Serif TC", "Songti TC", "PMingLiU", serif;
                font-size: 14px;
                letter-spacing: .3em;
                opacity: .7;
            }
            @keyframes ldPulse{
                0%, 100%{ transform: scale(1); opacity: .92; }
                50%{ transform: scale(1.07); opacity: 1; }
            }
            @keyframes ldDot{
                0%, 100%{ opacity: .2; }
                50%{ opacity: 1; }
            }
            @media (prefers-reduced-motion: reduce){
                .ld-orb, .ld-dots i{ animation: none; }
                .ld-dots i{ opacity: 1; }
            }
        </style>
        <noscript><style>#loader{ display: none; }</style></noscript>
    </head>
    <body>
        <div id="content">
            <iframe id="app" title="深藍宮 光明燈" width="100%" height="100%" frameborder="0" src="https://script.google.com/macros/s/AKfycbznGM41tXeyUYylvi9-bzjK0_39rABXfDlnoWBgUzLJp-3EjRy_cRNznIjO_-L1O_CR/exec"></iframe>
        </div>

        <div id="loader" role="status" aria-live="polite">
            <div class="ld-orb" aria-hidden="true"></div>
            <h1 class="ld-title">光明燈讀取中</h1>
            <div class="ld-dots" aria-hidden="true"><i>●</i><i>●</i><i>●</i></div>
            <div class="ld-bar" id="ldBar" role="progressbar" aria-label="讀取進度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
                <div class="ld-fill" id="ldFill"></div>
            </div>
            <div class="ld-pct" id="ldPct">0%</div>
            <div class="ld-sub">祝您闔家平安、萬事順利</div>
        </div>

        <script>
        (function () {
            var loader = document.getElementById('loader');
            var fill   = document.getElementById('ldFill');
            var pctEl  = document.getElementById('ldPct');
            var bar    = document.getElementById('ldBar');
            var frame  = document.getElementById('app');

            var start = Date.now();
            var shown = 0;          // 目前畫面上顯示的進度
            var real = 0;           // 光明燈頁面實際回報的進度
            var gotMsg = false;     // 是否收到過光明燈頁面的回報
            var finishing = false;  // 是否已經可以收尾
            var closed = false;

            function paint(v) {
                var n = Math.min(100, Math.floor(v));
                fill.style.width = v + '%';
                pctEl.textContent = n + '%';
                bar.setAttribute('aria-valuenow', n);
            }

            function hide() {
                if (closed) return;
                closed = true;
                loader.classList.add('hide');
                setTimeout(function () {
                    if (loader.parentNode) loader.parentNode.removeChild(loader);
                }, 800);
            }

            function finish() { finishing = true; }

            var timer = setInterval(function () {
                var t = Date.now() - start;
                var sim = 88 * (1 - Math.exp(-t / 5000));              // 估計值：緩慢逼近 88%，不會自己跑到 100%
                var target = finishing ? 100 : Math.min(99, Math.max(sim, real));
                var next = shown + (target - shown) * (finishing ? 0.25 : 0.12);
                if (target - next < 0.05) next = target;
                shown = Math.max(shown, next);                          // 進度只增不減
                paint(shown);
                if (finishing && shown >= 99.5) {
                    paint(100);
                    clearInterval(timer);
                    setTimeout(hide, 400);
                }
            }, 50);

            /* 光明燈頁面（Apps Script 裡）載入過程中會回報進度，完成時回報 ready */
            window.addEventListener('message', function (e) {
                var d = e.data;
                if (!d || d.type !== 'light-progress') return;
                gotMsg = true;
                var v = Number(d.value);
                if (v >= 0 && v <= 100) real = Math.max(real, v);
                if (d.ready) finish();
            });

            /* 備援：如果光明燈頁面沒有回報（例如還沒更新），外殼載入完成 4 秒後直接收尾 */
            frame.addEventListener('load', function () {
                setTimeout(function () { if (!gotMsg) finish(); }, 4000);
            });
            /* 最長等待 30 秒，避免擋住畫面 */
            setTimeout(finish, 30000);
        })();
        </script>
    </body>
</html>
